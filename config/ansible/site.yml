# Code Generated by Sidekick is for learning and experimentation purposes only.
- name: Install and start nginx
  hosts: private_instances
  become: true
  gather_facts: true

  tasks:
    - name: Install nginx on Debian/Ubuntu
      when: ansible_facts.os_family == "Debian"
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Install nginx on RHEL/Amazon Linux (YUM)
      when:
        - ansible_facts.os_family == "RedHat"
        - ansible_facts.distribution in ["Amazon", "CentOS", "RedHat", "Rocky", "AlmaLinux"]
        - ansible_facts.pkg_mgr == "yum"
      ansible.builtin.yum:
        name: nginx
        state: present
        update_cache: true

    - name: Install nginx on RHEL-family (DNF)
      when:
        - ansible_facts.os_family == "RedHat"
        - ansible_facts.pkg_mgr == "dnf"
      ansible.builtin.dnf:
        name: nginx
        state: present
        update_cache: true

    - name: Enable and start nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true