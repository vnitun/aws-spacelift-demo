plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

# Only include the instances you want Ansible to target
filters:
  "tag:Env": dev
  "tag:App": myapp
  instance-state-name: running

# Use instance-id as the hostname (works well with SSM)
hostnames:
  - instance-id

# Auto-set connection vars for every discovered host
compose:
  ansible_connection: "'community.aws.aws_ssm'"
  ansible_aws_ssm_region: "'us-east-1'"
  ansible_user: "'ec2-user'"
